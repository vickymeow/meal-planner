<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fff3df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="早饭晚饭" />
    <title>早饭晚饭 · 一家人好好吃饭</title>
    <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/mock-v19.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="screen" id="screen">
      <div class="sync-bar" id="sync-bar" role="status" hidden></div>

      <!-- ============ 妈妈屏 · 今天 ============ -->
      <section class="view" id="view-today" aria-label="今天" hidden>
        <div class="screen-scroll">
          <div class="switch" id="mode-switch" role="tablist" aria-label="定计划还是照着做">
            <button id="tab-plan" class="on" type="button" role="tab">📋 定计划<small>晚上定这一周</small></button>
            <button id="tab-cook" type="button" role="tab">🍳 照着做<small>做饭时看，看一周</small></button>
          </div>

          <div class="notify-banner" hidden></div>
          <div id="plan-area">
            <div class="day-head">
              <div class="day-when">定计划</div>
              <div class="day-date" id="plan-date"></div>
              <div class="day-meta" id="plan-meta"></div>
            </div>

            <div class="sec card-sec acc-red">
              <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">😋</span>大家最近想吃 <span class="hint">家里人点的</span></h2>
              <div id="wishes"></div>
            </div>

            <div class="sec card-sec acc-green">
              <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">🍽</span>妈妈定晚饭 <span class="hint">先点哪天</span></h2>
              <div class="day-strip" id="day-strip" role="tablist" aria-label="选日子"></div>
              <div class="sel-day" id="sel-day" hidden></div>
              <div class="home-sec">
                <div id="people"></div>
                <div id="guests-mom" hidden></div>
              </div>
              <div id="dinner-plan" style="margin-top:12px"></div>
              <button type="button" class="fold-btn" id="bf-fold" aria-expanded="false" aria-controls="breakfast"></button>
              <div id="breakfast" hidden></div>
            </div>
          </div>

          <div id="cook-area" hidden>
            <div class="day-head">
              <div class="day-when" id="cook-when">今天</div>
              <div class="day-date" id="cook-date"></div>
              <div class="day-meta" id="cook-meta"></div>
            </div>
            <div class="day-strip" id="cook-strip" role="tablist" aria-label="看哪天" style="margin-top:12px"></div>
            <button class="read-btn" id="read-btn" type="button" style="margin-top:16px">🔊 把今天的安排读给我听</button>
            <div class="read-panel" id="read-panel" hidden></div>
            <div class="sec" style="margin-top:18px" id="morning"></div>
            <div class="today-line" id="today-line"></div>
          </div>

          <div class="sec activity-sec card-sec acc-orange">
            <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">💬</span>家里动态 <span class="hint">最新的在最上面</span></h2>
            <div class="activity-card"><div class="history-box"></div></div>
          </div>
          <div class="sec page-fb" data-fb-slot></div>
        </div>
      </section>

      <!-- ============ 家里人屏（Vicky / 小陈 / 爸爸） ============ -->
      <section class="view" id="view-family" aria-label="我的这屏" hidden>
        <div class="screen-scroll">
          <div class="switch tab-switch" id="fam-switch" role="tablist" aria-label="我的安排还是本周菜单">
            <button id="dtab-order" class="on" type="button" role="tab">📝 我的安排<small>在家 · 早饭 · 想吃</small></button>
            <button id="dtab-menu" type="button" role="tab">🍲 本周菜单<small>妈妈做什么</small></button>
          </div>
          <div class="day-head">
            <div class="day-when" id="fam-when">我的安排</div>
            <div class="day-date" id="fam-date"></div>
            <div class="day-meta" id="fam-meta"></div>
          </div>

          <div class="notify-banner" hidden></div>
          <div id="family-main">
            <div class="sec card-sec acc-green">
              <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">🏠</span>这几天在家吃饭吗 <span class="hint">不在家再点开</span></h2>
              <div id="fam-home"></div>
            </div>
            <div class="sec card-sec acc-gold">
              <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">🥣</span>我的早饭 <span class="hint">自己定，妈妈热</span></h2>
              <div id="fam-bf-switch"></div>
              <button type="button" class="fold-btn" id="fam-bf-toggle" aria-expanded="false" aria-controls="fam-bf-body"></button>
              <div id="fam-bf-body" hidden>
                <div id="fam-breakfast"></div>
              </div>
            </div>
            <div class="sec card-sec acc-red">
              <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">😋</span>晚饭我想吃什么 <span class="hint">妈妈能看到</span></h2>
              <button class="order-big primary" id="fam-order-btn" type="button">🍽 晚饭我想吃这个<small>挑一道，再选有多想吃</small></button>
              <div id="fam-wishes" style="margin-top:12px"></div>
            </div>
            <div class="sec card-sec acc-blue">
              <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">🎉</span>有客人来 <span class="hint">平时折起来</span> <span class="guest-summary" id="guest-summary" hidden></span></h2>
              <button class="fold-btn" id="guest-fold-btn" type="button" aria-expanded="false" aria-controls="guest-body"></button>
              <div class="guest-collapsed-note" id="guest-collapsed-note" hidden></div>
              <div id="guest-body" hidden>
                <div class="guest-box">
                  <label>哪天来</label>
                  <div class="g-day-row" id="guest-day-row" role="group" aria-label="客人哪天来"></div>
                  <label for="guest-name">客人是谁</label>
                  <input class="add-input" id="guest-name" type="text" placeholder="比如：姑姑一家" aria-label="客人是谁" />
                  <label>几位</label>
                  <div class="g-count-row" id="guest-count-row" role="group" aria-label="几位客人"></div>
                  <button class="sheet-cta" id="guest-add-btn" type="button" style="background:#d99a2b;color:#3a2408">＋ 加上客人</button>
                </div>
                <div id="guest-list" style="margin-top:12px"></div>
              </div>
            </div>
          </div>

          <div id="family-today" hidden>
            <div class="sec card-sec acc-green">
              <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">🍲</span>妈妈做什么 <span class="hint">先点哪天</span></h2>
              <div class="day-strip" id="fam-day-strip" role="tablist" aria-label="选日子"></div>
              <div id="fam-today-menu"></div>
            </div>
          </div>

          <div class="sec activity-sec card-sec acc-orange">
            <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">💬</span>家里动态 <span class="hint">最新的在最上面</span></h2>
            <div class="activity-card"><div class="history-box"></div></div>
          </div>
          <div class="sec page-fb" data-fb-slot></div>
        </div>
      </section>

      <!-- ============ 菜谱 ============ -->
      <section class="view" id="view-menu" aria-label="菜谱" hidden>
        <div class="screen-scroll">
          <div class="day-head">
            <div class="day-when">菜谱</div>
            <div class="day-date" style="font-size:27px">全部的菜都在这</div>
            <div class="day-note">想做鱼，点「🐟 鱼」。</div>
          </div>
          <div class="sec" style="margin-top:20px">
            <button class="menu-add" id="menu-add-btn" type="button">＋ 加一道新菜（能说话加）</button>
            <button class="menu-rec" id="menu-rec-btn" type="button">✨ 帮我想新菜<small>一次推荐 4 道，喜欢就加</small></button>
            <div class="switch menu-tabs" id="menu-tabs" role="tablist" aria-label="早饭还是晚饭"></div>
            <div class="filter-row" id="menu-filter" aria-label="按主料找菜"></div>
            <div id="menu-list"></div>
          </div>
        </div>
      </section>

      <!-- ============ 买菜 ============ -->
      <section class="view" id="view-buy" aria-label="买菜" hidden>
        <div class="screen-scroll">
          <div class="day-head">
            <div class="day-when">买菜</div>
            <div class="day-date" style="font-size:27px">这一周要买的</div>
            <div class="day-note">买到了点一下，就划掉。</div>
          </div>
          <div class="sec" style="margin-top:20px">
            <div class="buy-sum" id="buy-sum"></div>
          </div>
          <div class="sec card-sec acc-gold">
            <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">🥛</span>自己加的 <span class="hint">牛奶、面包</span></h2>
            <button type="button" class="fold-btn" id="custom-toggle" aria-expanded="false" aria-controls="custom-body"></button>
            <div id="custom-body" hidden>
              <div style="font-size:15.5px;font-weight:800;color:#5d4f3f;margin-bottom:8px">常买，点一下就加：</div>
              <div class="staple-row" id="staple-row"></div>
              <div class="staple-edit">
                <input class="add-input" id="staple-input" type="text" placeholder="加进常买，比如：酸奶" aria-label="新常买的名字" />
                <button class="mini-btn" id="staple-add-btn" type="button">加进常买</button>
              </div>
              <div class="custom-box" style="margin-top:14px">
                <label for="custom-name">加一样东西</label>
                <div class="name-row">
                  <input class="add-input" id="custom-name" type="text" placeholder="比如：牛奶" aria-label="要买的东西" />
                  <button class="voice-btn" id="custom-voice" type="button" aria-label="说话输入要买的东西"></button>
                </div>
                <label for="custom-qty">买多少</label>
                <input class="add-input" id="custom-qty" type="text" placeholder="比如：2 盒" aria-label="份量" />
                <button class="sheet-cta" id="custom-add-btn" type="button" style="background:#2e7d5b">＋ 加到清单里</button>
              </div>
            </div>
            <div id="custom-list"></div>
          </div>
          <div class="sec card-sec acc-green">
            <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">🥬</span>做菜要买的 <span class="hint">按定好的菜合并</span></h2>
            <button type="button" class="fold-btn" id="buy-toggle" aria-expanded="true" aria-controls="buy-list"></button>
            <div id="buy-list"></div>
          </div>
          <div class="sec card-sec acc-blue">
            <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">📅</span>这一周每天做什么</h2>
            <div id="week-list"></div>
          </div>
        </div>
      </section>

      <!-- ============ 我的 ============ -->
      <section class="view" id="view-profile" aria-label="我的" hidden>
        <div class="screen-scroll">
          <div class="day-head">
            <div class="day-when">我的</div>
            <div class="day-date" style="font-size:27px">我自己的页面</div>
          </div>
          <div class="sec"><div class="profile-card" id="profile-card"></div></div>
          <div class="sec card-sec acc-gold">
            <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">📊</span>我的小结</h2>
            <div class="plan-card" style="padding:6px 14px"><div id="profile-stats"></div></div>
          </div>
          <div class="sec card-sec acc-orange" id="notify-sec"></div>
          <div class="sec" id="share-sec"></div>
          <div class="sec card-sec acc-blue">
            <h2 class="sec-title"><span class="sec-ic" aria-hidden="true">📱</span>这部手机是谁的</h2>
            <div class="me-grid" id="profile-who" role="group" aria-label="这部手机是谁的"></div>
          </div>
          <div class="sec" data-fb-slot></div>
          <div class="sec" id="credits-sec"></div>
          <div class="sec app-foot" id="app-foot"></div>
        </div>
      </section>

      <!-- 底部导航：哪屏都在 -->
      <nav class="bottom-nav" aria-label="底部导航">
        <button type="button" id="nav-today" class="on">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          今天
        </button>
        <button type="button" id="nav-menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
          菜谱
        </button>
        <button type="button" id="nav-buy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 12a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
          买菜
          <span class="nav-badge" id="buy-badge" hidden></span>
        </button>
        <button type="button" id="nav-profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
          我的
        </button>
      </nav>

      <!-- 语音助手：每个人、每一页都在右下角 -->
      <button class="voice-fab" id="voice-fab" type="button" aria-label="语音助手：说一句话，帮你办" hidden>
        <span class="vf-mic" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><rect x="17" y="4" width="14" height="24" rx="7" fill="#7a3b12"/><rect x="20.5" y="8" width="3.5" height="10" rx="1.75" fill="#ffd9a8"/><path d="M10 22a14 14 0 0 0 28 0" stroke="#7a3b12" stroke-width="4.5" stroke-linecap="round"/><path d="M24 36v6M16 44h16" stroke="#7a3b12" stroke-width="4.5" stroke-linecap="round"/></svg></span>
        <span class="vf-label">语音助手</span>
      </button>

      <input type="file" id="photo-file" accept="image/*" hidden />
      <div class="sheet-wrap" id="sheet-wrap">
        <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <!-- 第一次打开：这部手机是谁的 -->
      <div class="welcome" id="welcome" hidden>
        <div class="welcome-inner">
          <img src="icons/icon-192.png" alt="" class="welcome-icon" />
          <h1>这部手机是谁的？</h1>
          <p>点一下，以后打开就是你的那屏。</p>
          <div class="me-grid welcome-grid" id="welcome-grid"></div>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/photos.js"></script>
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
